# ============================================================
# FinOS Full Stack - 100% FREE local development
# ============================================================
# All services depend only on SQL Server (FREE Developer Edition).
# Redis is optional (services run fine without it).
# RabbitMQ and Elasticsearch removed - not needed for local dev.
# ============================================================

name: finos

services:
  # SQL Server 2022 Developer Edition - FREE for dev/test
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finos-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SA_PASSWORD=CHANGE_ME_SQL_PASSWORD
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ../FinOS.Database/Schema:/scripts/schema:ro
      - ../FinOS.Database/SeedData:/scripts/seed:ro
      - ../FinOS.Database/StoredProcedures:/scripts/sps:ro
      - ../FinOS.Database/Views:/scripts/views:ro
    networks:
      - finos-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "CHANGE_ME_SQL_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # SQL Server Init - Runs schema, seed data, SPs, views after SQL Server is healthy
  init-database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finos-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ../FinOS.Database/Schema:/scripts/schema:ro
      - ../FinOS.Database/SeedData:/scripts/seed:ro
      - ../FinOS.Database/StoredProcedures:/scripts/sps:ro
      - ../FinOS.Database/Views:/scripts/views:ro
    networks:
      - finos-network
    entrypoint: >
      bash -c '
        echo "=== FinOS Database Initialization ===" &&
        echo "Waiting for SQL Server..." &&
        sleep 5 &&
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P CHANGE_ME_SQL_PASSWORD -C" &&

        echo "--- Running Schema Scripts ---" &&
        for f in /scripts/schema/001_*.sql /scripts/schema/002_*.sql /scripts/schema/003_*.sql /scripts/schema/004_*.sql /scripts/schema/005_*.sql /scripts/schema/006_*.sql /scripts/schema/007_*.sql /scripts/schema/008_*.sql; do
          echo "  Executing: $$f" &&
          $$SQLCMD -i "$$f" || echo "  WARNING: $$f had errors";
        done &&

        echo "--- Running Seed Data ---" &&
        for f in /scripts/seed/001_*.sql /scripts/seed/002_*.sql /scripts/seed/003_*.sql; do
          echo "  Executing: $$f" &&
          $$SQLCMD -i "$$f" || echo "  WARNING: $$f had errors";
        done &&

        echo "--- Running Stored Procedures ---" &&
        for f in /scripts/sps/Security_sp.sql /scripts/sps/Core_sp.sql /scripts/sps/Budget_sp.sql /scripts/sps/Investment_sp.sql /scripts/sps/Loan_sp.sql /scripts/sps/Goals_sp.sql /scripts/sps/Analytics_sp.sql; do
          echo "  Executing: $$f" &&
          $$SQLCMD -i "$$f" || echo "  WARNING: $$f had errors";
        done &&

        echo "--- Running Views ---" &&
        for f in /scripts/views/Dashboard_Views.sql /scripts/views/Investment_Views.sql /scripts/views/Loan_Views.sql /scripts/views/Budget_Views.sql /scripts/views/Analytics_Views.sql /scripts/views/Admin_Views.sql; do
          echo "  Executing: $$f" &&
          $$SQLCMD -i "$$f" || echo "  WARNING: $$f had errors";
        done &&

        echo "=== Database Initialization Complete ==="
      '

  # Redis 7 - FREE (open source) - Optional caching layer
  redis:
    image: redis:7-alpine
    container_name: finos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - finos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API Gateway
  finos-gateway:
    build:
      context: .
      dockerfile: APIGateways/FinOS.Gateway/Dockerfile
    container_name: finos-gateway
    ports:
      - "6000:6000"
      - "6001:6001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:6001;http://+:6000
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=CHANGE_ME_CERT_PASSWORD
    depends_on:
      - finos-identity
      - finos-corefinance
      - finos-budget
      - finos-investment
      - finos-loan
      - finos-goals
      - finos-analytics
      - finos-aiassistant
      - finos-notification
    networks:
      - finos-network

  # Identity Service
  finos-identity:
    build:
      context: .
      dockerfile: Services/Identity/FinOS.Identity.API/Dockerfile
    container_name: finos-identity
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

  # CoreFinance Service
  finos-corefinance:
    build:
      context: .
      dockerfile: Services/CoreFinance/FinOS.CoreFinance.API/Dockerfile
    container_name: finos-corefinance
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
      - DocumentStorage__RootPath=/app/private-documents
    volumes:
      - financial_documents:/app/private-documents
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

  # Budget Service
  finos-budget:
    build:
      context: .
      dockerfile: Services/Budget/FinOS.Budget.API/Dockerfile
    container_name: finos-budget
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

  # Investment Service
  finos-investment:
    build:
      context: .
      dockerfile: Services/Investment/FinOS.Investment.API/Dockerfile
    container_name: finos-investment
    ports:
      - "5004:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5004
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

  # Loan Service
  finos-loan:
    build:
      context: .
      dockerfile: Services/Loan/FinOS.Loan.API/Dockerfile
    container_name: finos-loan
    ports:
      - "5005:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5005
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

  # Goals Service
  finos-goals:
    build:
      context: .
      dockerfile: Services/Goals/FinOS.Goals.API/Dockerfile
    container_name: finos-goals
    ports:
      - "5006:5006"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5006
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

  # Analytics Service
  finos-analytics:
    build:
      context: .
      dockerfile: Services/Analytics/FinOS.Analytics.API/Dockerfile
    container_name: finos-analytics
    ports:
      - "5007:5007"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5007
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

  # AI Assistant Service
  finos-aiassistant:
    build:
      context: .
      dockerfile: Services/AIAssistant/FinOS.AIAssistant.API/Dockerfile
    container_name: finos-aiassistant
    ports:
      - "5008:5008"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5008
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - LLM__ApiKey=your-api-key-here
      - LLM__Endpoint=https://api.openai.com/v1
      - LLM__Model=gpt-4
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

  # Notification Service
  finos-notification:
    build:
      context: .
      dockerfile: Services/Notification/FinOS.Notification.API/Dockerfile
    container_name: finos-notification
    ports:
      - "5009:5009"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5009
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FinOS;User Id=sa;Password=CHANGE_ME_SQL_PASSWORD;TrustServerCertificate=True;
      - Jwt__Key=CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS
      - Jwt__Issuer=FinOS
      - Jwt__Audience=FinOS Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - finos-network

networks:
  finos-network:
    driver: bridge

volumes:
  sqlserver_data:
  redis_data:
  financial_documents:
